<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoopoe Studios</title>
<meta name="description" content="Hoopoe Studios makes games.">
<meta name="theme-color" content="#FFF4E2">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Hoopoe Studios">
<meta property="og:description" content="Hoopoe Studios makes games.">
<meta property="og:url" content="https://hoopoestudios.co.uk/">
<meta property="og:image" content="https://hoopoestudios.co.uk/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap">
<style>
  :root { --ink: #1F1B2E; --cream: #FFF4E2; --muted: #5A5468; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--cream); color: var(--ink);
    font-family: Nunito, system-ui, sans-serif; font-weight: 800;
  }
  main {
    flex: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 24px 40px; padding: 48px 16px;
  }
  .bird { position: relative; width: min(380px, 80vw); aspect-ratio: 230 / 220; }
  .bird > img { width: 100%; height: 100%; animation: bob 1.8s ease-in-out infinite; transform-origin: 50% 90%; }
  .orbit { position: absolute; left: 62%; top: 30%; width: 0; height: 0; animation: orbit 5s linear infinite; }
  .orbit img { position: absolute; left: -17px; top: -17px; width: 34px; height: 34px; animation: face 5s linear infinite; }
  .name { display: flex; flex-direction: column; gap: 20px; max-width: 100%; }
  .name img { width: min(440px, 85vw); max-width: 100%; height: auto; }
  .name p { margin: 0; font-size: 20px; color: var(--muted); }
  footer { padding: 24px 16px; text-align: center; font-size: 14px; color: var(--muted); }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(-3deg); } }
  @keyframes orbit {
    from { transform: rotate(0deg) translateX(min(150px, 30vw)) rotate(0deg); }
    to { transform: rotate(360deg) translateX(min(150px, 30vw)) rotate(-360deg); }
  }
  @keyframes face { 0%, 49.9% { transform: scaleX(-1); } 50%, 100% { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) {
    .bird > img, .orbit, .orbit img { animation: none; }
    .orbit { transform: translate(110px, -40px); }
  }
</style>
</head>
<body>
<main>
  <div class="bird">
    <img src="/assets/bird.svg" alt="A cheeky hoopoe on a blossom branch">
    <div class="orbit" aria-hidden="true"><img src="/assets/bee-light.svg" alt=""></div>
  </div>
  <div class="name">
    <h1 style="margin: 0;"><img src="/assets/wordmark.svg" alt="Hoopoe Studios"></h1>
    <p>Coming soon.</p>
  </div>
</main>
<footer>© 2026 Hoopoe Studios</footer>
</body>
</html>
